spring.application.name=inmueble-service
# definimos el puerto donde queremos que se ejecute la aplicación 
server.port=3333;

# indicamos la ubicación en donde esta nuestra base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/db_inmueble?currentSchema=sc_inmueble&ssl=false
# indicamos usuario y contraseña con el cual nos vamos a conectar a la base de datos
spring.datasource.username=admin
spring.datasource.password=Om4r2023!01
# indicamos el driver a utilizar para la conexión
spring.datasource.driver-class-name=org.postgresql.Driver
# indicamos el dialecto --> mapear las tablas dentro de entidades java
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# configuración para enlazar entidades con tablas sql (por cada entidad, se crea una tabla automaticamente)
spring.jpa-hibernate.ddl-auto=update
# condiguración para mostrar comandos sql, cuando se genere una consulta a la base de datos
spring.jpa-show-sql=true
# configuración para conexión a servicios externos (eureka)
eureka.client.enable=false


